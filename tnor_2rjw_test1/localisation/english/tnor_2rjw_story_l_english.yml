l_english:
 TNOR_2RJW_secret_meeting:0 "A secret meeting"
 TNOR_2RJW_secret_meeting_desc:0 "The General Staff meets behind closed doors to decide which frontier will command Russia's attention."
 TNOR_2RJW_march_east:0 "Eye to the east"
 TNOR_2RJW_march_east_desc:0 "Begin preparations for an eastern campaign. At least 730 days must pass before hostilities can begin."
 TNOR_2RJW_return_to_eastern_question:0 "Return to the Eastern Question"
 TNOR_2RJW_return_to_eastern_question_desc:0 "Peace in the west and the conclusion of reconstruction and elections allow us to reopen the eastern question."
 tnor_2rjw_story.1.t:0 "Behind Closed Doors"
 tnor_2rjw_story.1.d:0 "The officers spread two maps across the table. The first showed the roads west and the territories still under German rule. The second followed a single railway east to the coast. The chairman asked which map should stay on the table."
 tnor_2rjw_story.1.a:0 "The General Staff will have its answer."
 tnor_2rjw_story.2.t:0 "The Eastern Question"
 tnor_2rjw_story.2.d:0 "The General Staff will prepare the western campaign. The cabinet must still decide what to tell Tokyo. We can open talks over Vladivostok now, or leave the question for a government that has already made peace in the west."
 tnor_2rjw_story.2.a:0 "Open negotiations with Japan."
 tnor_2rjw_story.2.b:0 "Settle the question after victory over Germany."
