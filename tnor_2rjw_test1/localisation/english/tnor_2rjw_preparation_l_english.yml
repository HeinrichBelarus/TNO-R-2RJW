l_english:
 tnor_2rjw_eastern_preparation:0 "Stage 1 of the Preparation"
 TNOR_2RJW_survey_the_trans_siberian:0 "No Mercy for the Rising Sun"
 TNOR_2RJW_survey_the_trans_siberian_desc:0 "The eastern map is back on the General Staff's table. Vladivostok still appears on it in the type used for foreign ports. Before anyone can change that, we need to know how many trains Russia can send east and how long it can keep them running."
 TNOR_2RJW_calm_before_the_storm:0 "Calm Before the Storm"
 TNOR_2RJW_calm_before_the_storm_desc:0 "At the Japanese desk that handles Russian correspondence, the evening post contains nothing from us. In Novosibirsk, copies of railway timetables are already circulating under seal. For now, a quiet week suits everyone."
 TNOR_2RJW_establish_the_railway_modernisation_committee:0 "Establish the Railway Modernisation Committee"
 TNOR_2RJW_establish_the_railway_modernisation_committee_desc:0 "Every railway district has a different account of how much traffic the Trans-Siberian can bear. Bring dispatchers, engineers and army quartermasters to the same table and have them answer for a single timetable."
 TNOR_2RJW_every_hand_to_the_rails:0 "Every Hand to the Rails"
 TNOR_2RJW_every_hand_to_the_rails_desc:0 "The railway districts know which bridges need new spans and which sidings are too short for military trains. Give their repair gangs the men and materials to clear the backlog while civilian trains are still running."
 TNOR_2RJW_no_time_to_waste:0 "No Time to Waste"
 TNOR_2RJW_no_time_to_waste_desc:0 "The engineers have marked the stretches where a single breakdown could hold up the whole line. Those jobs go to the head of the queue. Workshops and districts that finish early will send their crews wherever the schedule is slipping."
 TNOR_2RJW_acquire_more_locomotives:0 "Acquire More Locomotives"
 TNOR_2RJW_acquire_more_locomotives_desc:0 "A siding is of little use when the locomotive meant to serve it is awaiting an overhaul a thousand kilometres away. Order new freight engines and put the older ones through the workshops while there is still time to test them."
 TNOR_2RJW_the_railway_to_retribution:0 "The Railway to Retribution"
 TNOR_2RJW_the_railway_to_retribution_desc:0 "The next test of the Trans-Siberian is a full military timetable laid over the civilian one. If the troop trains can clear the junctions and the coal can still get through, the army can plan on reaching the Pacific in force."
 TNOR_2RJW_the_logistics_of_conquest:0 "The Logistics of Conquest"
 TNOR_2RJW_the_logistics_of_conquest_desc:0 "The quartermasters want an answer to a simple question. What will each division consume in a week beyond the last railway station? The answer will determine how far the army can go before it has to stop."
 TNOR_2RJW_the_lifeblood_of_war:0 "The Lifeblood of War"
 TNOR_2RJW_the_lifeblood_of_war_desc:0 "The fuel service must set aside enough petrol and diesel to keep the army moving through the first weeks of a campaign. Its estimates must also cover the tankers making the return journey and the towns that still depend on regular deliveries."
 TNOR_2RJW_steel_horses_of_siberia:0 "Steel Horses of Siberia"
 TNOR_2RJW_steel_horses_of_siberia_desc:0 "The army's truck registers are full of vehicles that share little beyond the number of wheels. Survey the fleet, draw up a common list of spares and put the most reliable trucks on the eastern runs."
 TNOR_2RJW_a_network_of_supply:0 "A Network of Supply"
 TNOR_2RJW_a_network_of_supply_desc:0 "A chain of depots will connect the railheads to the roads the army expects to use. Each district must be able to draw from a second depot if its usual one is cut off."
 TNOR_2RJW_fill_the_depots:0 "Fill the Depots"
 TNOR_2RJW_fill_the_depots_desc:0 "A warehouse only counts as ready once someone has opened the crates and checked what is inside. The quartermasters will inspect the stock, replace what has spoiled and set aside enough to carry the army past its first scheduled resupply."
 TNOR_2RJW_no_distance_too_great:0 "No Distance Too Great"
 TNOR_2RJW_no_distance_too_great_desc:0 "The first loaded convoys will run the route on the timetable proposed for the campaign. Their drivers will report where the roads give out, where a bridge will take only one truck at a time and how long unloading actually takes."
 TNOR_2RJW_the_long_road_east:0 "The Long Road East"
 TNOR_2RJW_the_long_road_east_desc:0 "The railway can take us across Siberia, and the trucks and depots can carry us beyond its last station. The General Staff can now calculate how long the eastern army can stay in the field before it needs a pause."
 TNOR_2RJW_a_shadow_falls_upon_the_east:0 "A Shadow Falls Upon the East"
 TNOR_2RJW_a_shadow_falls_upon_the_east_desc:0 "On a foggy morning in Sakhalin, a Japanese official catches a movement at the edge of a wood. By breakfast he has almost forgotten it. Then he remembers what a young air defence soldier told him about the base just beyond the trees."
 TNOR_2RJW_a_thousand_eyes_across_the_border:0 "A Thousand Eyes Across the Border"
 TNOR_2RJW_a_thousand_eyes_across_the_border_desc:0 "Reports from railway workers, fishing crews and travellers are beginning to give us a picture of the frontier. Intelligence officers will compare the accounts over time to work out which garrisons have actually moved."
 TNOR_2RJW_a_silent_hatred:0 "A Silent Hatred"
 TNOR_2RJW_a_silent_hatred_desc:0 "Families divided by the frontier have memories that rarely make it into the official reports. Before we ask anyone to take a risk on our behalf, we should listen to what people in Mongolia and Primorye expect from us."
 TNOR_2RJW_the_invisible_hand:0 "The Invisible Hand"
 TNOR_2RJW_the_invisible_hand_desc:0 "The contacts in Mongolia and Primorye are ready to organise brigades of their own. Russia can send infantry weapons, anti-tank equipment and support gear to either network. Each complete shipment equips one brigade in the region that receives it."
 TNOR_2RJW_a_dagger_at_their_throat:0 "A Dagger at Their Throat"
 TNOR_2RJW_a_dagger_at_their_throat_desc:0 "The partisan organisers need to know what Russia expects of them when the time comes. Agree on how we will call them into the fighting and give both networks enough warning to assemble the brigades they have equipped."
 TNOR_2RJW_across_the_pacific:0 "Across the Pacific"
 TNOR_2RJW_across_the_pacific_desc:0 "Our first message to Washington should explain why a dispute over a distant Russian port matters on both sides of the Pacific. If the Americans are willing to hear us out, there will be time for more specific requests."
 TNOR_2RJW_the_scars_we_carry:0 "The Scars We Carry"
 TNOR_2RJW_the_scars_we_carry_desc:0 "Every government that has had to deal with Tokyo has a story about a promise made under pressure. Our envoys will start by comparing those experiences with our own and finding out which countries are willing to talk further."
 TNOR_2RJW_behind_closed_doors:0 "Behind Closed Doors"
 TNOR_2RJW_behind_closed_doors_desc:0 "American officials can discuss more in private than their government can promise from a podium. Let the delegation find out where the limits lie on equipment sales and technical assistance before either side makes the talks public."
 TNOR_2RJW_different_shores_the_same_scars:0 "Different Shores, the Same Scars"
 TNOR_2RJW_different_shores_the_same_scars_desc:0 "The countries around Japan's sphere have their own grievances and their own reasons to move carefully. Our envoys should find subjects on which they can work with us without asking them to settle old disputes with one another first."
 TNOR_2RJW_arsenal_of_democracy:0 "Arsenal of Democracy"
 TNOR_2RJW_arsenal_of_democracy_desc:0 "An American offer is useful only if it can reach Siberia and if our crews know how to keep the equipment running. The purchasing mission will bring the army's list of requirements and ask what can actually be delivered."
 TNOR_2RJW_the_tiger_and_the_bear:0 "The Tiger and the Bear"
 TNOR_2RJW_the_tiger_and_the_bear_desc:0 "Tokyo counts on negotiating with its neighbours one at a time. We can begin to change that by finding common ground with Asian governments on trade, shipping and what happens if Japan puts pressure on any one of them."
 TNOR_2RJW_friends_at_the_edge_of_the_world:0 "Friends at the Edge of the World"
 TNOR_2RJW_friends_at_the_edge_of_the_world_desc:0 "The meetings with the Americans have given both sides people they can call when a shipment is held or a report needs checking. Put those arrangements in writing while the officials who made them are still at their desks."
 TNOR_2RJW_now_let_the_guns_speak:0 "Now Let the Guns Speak"
 TNOR_2RJW_now_let_the_guns_speak_desc:0 "The Foreign Ministry has a clearer idea of who might help and what they are prepared to risk. The campaign plan can now be drawn around what Russia can count on supplying itself, with room for any help that reaches us."
 TNOR_2RJW_our_industrial_might:0 "Our Industrial Might"
 TNOR_2RJW_our_industrial_might_desc:0 "Reunification has put mines, mills and workshops under one government. It is time to find out what they can produce together and how much of their output we can spare for a second national effort."
 TNOR_2RJW_the_riches_beneath_our_feet:0 "The Riches Beneath Our Feet"
 TNOR_2RJW_the_riches_beneath_our_feet_desc:0 "Survey the coal and ore deposits close enough to existing lines to supply the factories this year. Reopening a working mine can do more for the programme than a richer discovery that still needs a railway."
 TNOR_2RJW_fuel_for_the_coming_storm:0 "Fuel for the Coming Storm"
 TNOR_2RJW_fuel_for_the_coming_storm_desc:0 "The oilfields and refineries must agree on what they can deliver through winter. Keep enough storage in reserve to cover a delayed shipment and make sure the eastern districts can draw on it without stopping deliveries to the rest of the country."
 TNOR_2RJW_every_ton_counts:0 "Every Ton Counts"
 TNOR_2RJW_every_ton_counts_desc:0 "A wagon of ore held at the wrong siding can idle a furnace for a shift. Give the mines, mills and railway dispatchers a shared record of what has left, where it is going and what is already waiting to be unloaded."
 TNOR_2RJW_blood_sweat_and_iron:0 "Blood, Sweat and Iron"
 TNOR_2RJW_blood_sweat_and_iron_desc:0 "The steel programme depends on the people who work the mines and tend the furnaces. Keep them housed, fed and supplied with sound equipment so that the mills can sustain the output the army has requested."
 TNOR_2RJW_the_assembly_lines_never_sleep:0 "The Assembly Lines Never Sleep"
 TNOR_2RJW_the_assembly_lines_never_sleep_desc:0 "The factories can run additional shifts if the tools, foremen and component deliveries are there to support them. Expand the lines gradually enough for the new crews to learn their work before the first rush of orders."
 TNOR_2RJW_the_furnaces_burn_brighter:0 "The Furnaces Burn Brighter"
 TNOR_2RJW_the_furnaces_burn_brighter_desc:0 "The foundries must keep pace with the assembly shops. Schedule the maintenance now, while there is room to take a furnace out of service, and give the steelworks firm orders that tell them what grades the factories need."
 TNOR_2RJW_built_to_kill_built_to_last:0 "Built to Kill, Built to Last"
 TNOR_2RJW_built_to_kill_built_to_last_desc:0 "A rifle or engine sent east will spend months far from the factory that built it. Inspectors will test whether the parts can be replaced with the tools and spares a field workshop will actually have."
 TNOR_2RJW_the_sound_of_a_thousand_hammers:0 "The Sound of a Thousand Hammers"
 TNOR_2RJW_the_sound_of_a_thousand_hammers_desc:0 "A machine shop may have all the orders it can handle while a neighbouring works sits idle for want of one part. Link the suppliers' production schedules so that the finished equipment can leave the factory as soon as it is needed."
 TNOR_2RJW_do_russians_want_war:0 "Do Russians Want War?"
 TNOR_2RJW_do_russians_want_war_desc:0 "People who spent years waiting for their sons to come home are entitled to ask why the state is preparing for another war. The government should explain what is at stake in the Far East and what another mobilisation would ask of them."
 TNOR_2RJW_yet_another_war:0 "Yet We Fight Again"
 TNOR_2RJW_yet_another_war_desc:0 "The railways and factories will feel the first demands of mobilisation long before the country hears a shot. Ministers owe workers and families an honest account of which sacrifices are coming and how long the government expects them to last."
 TNOR_2RJW_peace_will_have_to_wait:0 "Peace Will Have to Wait"
 TNOR_2RJW_peace_will_have_to_wait_desc:0 "Military orders will take some of the steel, fuel and labour promised to civilian projects. The cabinet must decide which work can be deferred and which services have to keep running through the campaign."
 TNOR_2RJW_for_the_sake_of_a_free_tomorrow:0 "For the Sake of a Free Tomorrow"
 TNOR_2RJW_for_the_sake_of_a_free_tomorrow_desc:0 "The country can bear a temporary mobilisation if it knows what it is for. Put the purpose of the eastern campaign plainly before the public and make clear what the government owes to those carrying the cost at home."
 TNOR_2RJW_the_storm_takes_shape:0 "The Storm Takes Shape"
 TNOR_2RJW_the_storm_takes_shape_desc:0 "The first phase has given the General Staff a working picture of the railways, industry, foreign support and the partisan networks. The next phase belongs to the commanders who have to turn those resources into a campaign."
 tnor_2rjw_eastern_preparation_stage_2:0 "Stage 2 of the Preparation"
 TNOR_2RJW_the_wind_begins_to_howl:0 "The Wind Begins to Howl"
 TNOR_2RJW_the_wind_begins_to_howl_desc:0 "The army now has a better idea of what the country can put at its disposal. Bring the service chiefs and the planners together to decide what forces the eastern campaign requires and where Russia can afford to commit them."
 TNOR_2RJW_fortify_the_western_border:0 "Fortify the Western Border"
 TNOR_2RJW_fortify_the_western_border_desc:0 "Berlin will watch for any gap left by the move east. The western districts must survey the ground they can hold with their remaining troops and complete the defensive works before the army starts withdrawing its reserves."
 TNOR_2RJW_mobilise_the_border_guards:0 "Mobilise the Border Guards"
 TNOR_2RJW_mobilise_the_border_guards_desc:0 "The army cannot keep every regular formation on the western frontier. Call up and train enough border guards to take over the observation posts and keep district commanders informed when the troops depart."
 TNOR_2RJW_keep_berlin_guessing:0 "Keep Berlin Guessing"
 TNOR_2RJW_keep_berlin_guessing_desc:0 "German observers will see trains leaving for Siberia. Headquarters should control what it says about the transfers so that Berlin has to weigh several explanations before deciding how strong our western forces are."
 TNOR_2RJW_a_plan_meant_to_be_stolen:0 "A Plan Meant to Be Stolen"
 TNOR_2RJW_a_plan_meant_to_be_stolen_desc:0 "Prepare a convincing exercise plan that gives German analysts a reason to expect a sizeable reserve in the west. Its details must agree with the routine activity they can already observe along the frontier."
 TNOR_2RJW_the_phantom_army:0 "The Phantom Army"
 TNOR_2RJW_the_phantom_army_desc:0 "The reserve on paper must leave a trace in the daily reports. Keep the old headquarters active and hold exercises with the formations still in the west while the train schedules shift the real reserves east."
 TNOR_2RJW_all_quiet_on_the_western_front:0 "All Quiet on the Western Front"
 TNOR_2RJW_all_quiet_on_the_western_front_desc:0 "The western commanders have inspected their posts and handed over the patrol routes. Their reports give the General Staff enough confidence to release the forces it needs in Siberia while keeping a watch on Berlin."
 TNOR_2RJW_sharpen_the_sword:0 "Sharpen the Sword"
 TNOR_2RJW_sharpen_the_sword_desc:0 "The next army review must account for rivers, long supply lines and the lack of good roads near the Pacific. Infantry, armour and naval infantry will each need time to prepare for their share of that campaign."
 TNOR_2RJW_the_amphibious_spearhead:0 "The Amphibious Spearhead"
 TNOR_2RJW_the_amphibious_spearhead_desc:0 "The first troops ashore may have to hold a landing site before heavy stores and vehicles can follow. The naval infantry will practise loading, landing and bringing its own support equipment off the boats."
 TNOR_2RJW_where_rivers_run_red:0 "Where Rivers Run Red"
 TNOR_2RJW_where_rivers_run_red_desc:0 "The rivers on the eastern maps are obstacles in their own right. Train the crossing units with engineers and boat crews until the first companies can get across and the rest of the formation can follow with its supplies."
 TNOR_2RJW_through_fire_and_water:0 "Through Fire and Water"
 TNOR_2RJW_through_fire_and_water_desc:0 "The naval infantry's final exercise will run from embarkation through relief by the follow-on troops. The commanders need to see whether armour, boats and infantry can keep to the same schedule in poor weather."
 TNOR_2RJW_the_steel_fist:0 "The Steel Fist"
 TNOR_2RJW_the_steel_fist_desc:0 "The armoured commanders will need usable vehicles, trained crews and enough recovery teams to keep a column together on the eastern roads. Inspect the brigades before deciding which of them is ready to deploy."
 TNOR_2RJW_engines_of_destruction:0 "Engines of Destruction"
 TNOR_2RJW_engines_of_destruction_desc:0 "A tank that performs well on the test ground may spend a whole morning stopped on a Siberian road. Have the crews test their engines in cold weather and make the workshops learn the faults that show up on long marches."
 TNOR_2RJW_crush_them_beneath_our_tracks:0 "Crush Them Beneath Our Tracks"
 TNOR_2RJW_crush_them_beneath_our_tracks_desc:0 "The armoured formations will exercise with infantry, engineers and supply columns. The test ends when the whole force reaches its next position with enough fuel and serviceable vehicles to keep going."
 TNOR_2RJW_the_backbone_of_the_army:0 "The Backbone of the Army"
 TNOR_2RJW_the_backbone_of_the_army_desc:0 "The rifle divisions will spend the longest stretches away from good roads and established depots. Check what each regiment can carry, how it replaces men and equipment and how long it can hold a position before relief."
 TNOR_2RJW_the_scars_of_a_thousand_battles:0 "The Scars of a Thousand Battles"
 TNOR_2RJW_the_scars_of_a_thousand_battles_desc:0 "Veterans from the reunification wars know which parts of the training manual survived contact with the field. Bring them into the schools to teach the new battalions what they learned about keeping a company together under pressure."
 TNOR_2RJW_through_mud_and_fire:0 "Through Mud and Fire"
 TNOR_2RJW_through_mud_and_fire_desc:0 "The rifle divisions' last exercise will take them across ground where the trucks cannot keep up. The battalion staffs will be judged on whether they can keep men supplied and organise relief when the timetable begins to slip."
 TNOR_2RJW_the_roar_of_a_thousand_engines:0 "The Roar of a Thousand Engines"
 TNOR_2RJW_the_roar_of_a_thousand_engines_desc:0 "The air force needs forward fields where it can refuel, rearm and repair aircraft through a full day of operations. Every plan for sending squadrons east must include the ground crews and workshop trains that keep them flying."
 TNOR_2RJW_the_sky_shall_burn:0 "The Sky Shall Burn"
 TNOR_2RJW_the_sky_shall_burn_desc:0 "The eastern railheads, depots and airfields are the fixed points on which the campaign depends. The air defence command must decide how to cover them and make sure its warning posts can reach the batteries when an aircraft is sighted."
 TNOR_2RJW_the_war_room:0 "The War Room"
 TNOR_2RJW_the_war_room_desc:0 "Bring representatives from the army, air force, navy and railway service into a single planning staff. It will keep one set of maps and commitments so that two commands cannot promise the same trains or reserves."
 TNOR_2RJW_on_the_chessboard_of_war:0 "On the Chessboard of War"
 TNOR_2RJW_on_the_chessboard_of_war_desc:0 "The staff will weigh the risks each approach leaves elsewhere in Asia. It must agree where to commit first, which commitments can wait and what would make it change course once the campaign begins."
 TNOR_2RJW_blueprint_for_victory:0 "Blueprint for Victory"
 TNOR_2RJW_blueprint_for_victory_desc:0 "Turn the chosen approach into orders the field headquarters can use. Each command needs a clear assignment, an agreed schedule and a reserve it knows how to call upon when circumstances change."
 TNOR_2RJW_no_margin_for_error:0 "No Margin for Error"
 TNOR_2RJW_no_margin_for_error_desc:0 "Have officers from outside the planning staff test its assumptions. Give them a delayed railway, a bad week of weather and a reluctant partner. Every failure they find now is one the field commanders may be spared."
 TNOR_2RJW_the_die_is_cast:0 "The Die Is Cast"
 TNOR_2RJW_the_die_is_cast_desc:0 "The final plans go before the government for approval. Once the President has signed off, the service chiefs can issue the sealed orders and set the last movements in motion."
 TNOR_2RJW_the_sword_is_sharpened:0 "The Sword Is Sharpened"
 TNOR_2RJW_the_sword_is_sharpened_desc:0 "The armed forces have finished their preparations, and the campaign plan is ready. Before the final deployment, the cabinet has to decide where it stands with Xinjiang and Qinghai."
 tnor_2rjw_eastern_preparation_stage_3:0 "Stage 3 of the Preparation"
 TNOR_2RJW_let_the_seas_boil:0 "Let the Seas Boil"
 TNOR_2RJW_let_the_seas_boil_desc:0 "The first move is to put the designated districts of Mongolia and Primorye under demilitarisation. The major cities remain outside it. At Irkutsk, the first reserves begin reporting to their units."
 TNOR_2RJW_let_the_stars_fall:0 "Let the Stars Fall"
 TNOR_2RJW_let_the_stars_fall_desc:0 "The Mongolian and Far Eastern partisans are ready to proclaim governments of their own. Their organisers will come into the open where they can take control, while the Russian reserves continue to assemble at Irkutsk."
 TNOR_2RJW_let_the_heavens_tremble:0 "Let the Heavens Tremble"
 TNOR_2RJW_let_the_heavens_tremble_desc:0 "The partisan governments can now call up the formations for which we furnished equipment. Each complete shipment will put one brigade in the field, and the number must be counted separately for Mongolia and the Far East."
 TNOR_2RJW_even_if_it_takes_every_last_drop_of_our_blood:0 "Even If It Takes Every Last Drop of Our Blood"
 TNOR_2RJW_even_if_it_takes_every_last_drop_of_our_blood_desc:0 "The men arriving in Irkutsk know what it means to be called up after the country has finally come together. Their officers must make sure that every company has its full complement and that families know where to send letters."
 TNOR_2RJW_we_shall_see_the_east_free_once_more:0 "We Shall See the East Free Once More"
 TNOR_2RJW_we_shall_see_the_east_free_once_more_desc:0 "Vladivostok is still a place some of our soldiers know mainly from their parents' stories. The campaign will be judged by what happens to the people who live there now and whether they can go on living in peace when the fighting is done."
 TNOR_2RJW_the_rising_sun_shall_set:0 "The Rising Sun Shall Set"
 TNOR_2RJW_the_rising_sun_shall_set_desc:0 "The Japanese sphere has relied on the assumption that its mainland frontier could be managed one crisis at a time. The partisan governments and the Russian army are preparing to take the field together."
 TNOR_2RJW_forevermore:0 "Forevermore"
 TNOR_2RJW_forevermore_desc:0 "The last orders are ready for transmission. The army will use the remaining hours to confirm that the partisan governments have received their instructions and that the final reserves at Irkutsk are present and accounted for."
 TNOR_2RJW_the_storm_begins:0 "The Storm Begins"
 TNOR_2RJW_the_storm_begins_desc:0 "The demilitarisation orders are lifted. The Mongolian and Far Eastern partisans will join Russia's alliance as we enter the war against Japan, Mengjiang and Manchuria."
