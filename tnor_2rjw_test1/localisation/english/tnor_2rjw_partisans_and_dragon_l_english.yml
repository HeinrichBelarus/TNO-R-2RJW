l_english:
 TNOR_2RJW_friends_in_distant_lands:0 "Friends in Distant Lands"
 TNOR_2RJW_friends_in_distant_lands_desc:0 "Washington has the industrial capacity to help us, and Japan's neighbours know the region in ways our diplomats never will. The Foreign Ministry will pursue both conversations before asking anyone to commit to a war."
 TNOR_2RJW_the_dragons_fractured_realm:0 "The Dragon's Fractured Realm"
 TNOR_2RJW_the_dragons_fractured_realm_desc:0 "Xinjiang and Qinghai each have a government of their own, and neither can be treated as a province whose consent someone else can give. The cabinet must decide what guarantees Russia needs from the two before turning towards Japan."
 TNOR_2RJW_an_ultimatum_in_disguise:0 "An Ultimatum in Disguise"
 TNOR_2RJW_an_ultimatum_in_disguise_desc:0 "The cabinet can send delegations to Xinjiang and Qinghai with an offer of protection on Russian terms. If it chooses force, or if a government refuses the offer, the General Staff will have to settle the question."
 TNOR_2RJW_operation_broken_dragon:0 "Operation Broken Dragon"
 TNOR_2RJW_operation_broken_dragon_desc:0 "The government has authorised a campaign against Xinjiang and Qinghai. As each government capitulates, we will keep its administration in place under Russian supervision."
 TNOR_2RJW_a_common_enemy_a_common_cause:0 "A Common Enemy, A Common Cause"
 TNOR_2RJW_a_common_enemy_a_common_cause_desc:0 "The delegations have secured acceptance of the Russian terms. Ratification will place the governments of Xinjiang and Qinghai under Russia's protection and give us control over their foreign and military policy."
 TNOR_2RJW_the_sun_begins_to_set:0 "The Sun Begins to Set"
 TNOR_2RJW_the_sun_begins_to_set_desc:0 "The question of Xinjiang and Qinghai has been settled. The General Staff can turn its attention to the final deployments and give the organisers in Mongolia and Primorye notice to stand ready."
 tnor_2rjw_partisan_supply_category:0 "Equipping the Partisans"
 tnor_2rjw_partisan_supply_category_desc:0 "§YMongolia§! — [?tnor_2rjw_mongolia_divisions|0] divisions equipped and ready.\n§YFar East§! — [?tnor_2rjw_primorye_divisions|0] divisions equipped and ready."
 tnor_2rjw_supply_mongolia:0 "Equip a Mongolian Partisan Brigade"
 tnor_2rjw_supply_primorye:0 "Equip a Far Eastern Partisan Brigade"
 tnor_2rjw_supply_mongolia_desc:0 "Allocate 615 infantry equipment, 72 anti-tank weapons and 30 support equipment to one brigade in Mongolia."
 tnor_2rjw_supply_primorye_desc:0 "Allocate 615 infantry equipment, 72 anti-tank weapons and 30 support equipment to one brigade in the Far East."
 tnor_2rjw_dragon.1.t:0 "An Ultimatum in Disguise"
 tnor_2rjw_dragon.1.d:0 "The western provinces of China sit between our armies and the Japanese sphere. The cabinet must choose whether to seek an agreement with Xinjiang and Qinghai or empower the General Staff to impose our terms."
 tnor_2rjw_dragon.1.a:0 "Send the delegations."
 tnor_2rjw_dragon.1.b:0 "Prepare Operation Broken Dragon."
 tnor_2rjw_dragon.2.t:0 "An Offer from Russia"
 tnor_2rjw_dragon.2.d:0 "The Russian delegates have arrived in [ROOT.GetNameDef] with a draft agreement. Their government promises protection in the coming conflict. In return, it demands authority over our foreign and military policy."
 tnor_2rjw_dragon.2.a:0 "Accept the terms."
 tnor_2rjw_dragon.2.b:0 "Reject the proposal."
 tnor_2rjw_dragon.3.t:0 "A Common Enemy, A Common Cause"
 tnor_2rjw_dragon.3.d:0 "The delegations have accepted the terms. Ratification will bring the signatories into the Russian sphere as dependent governments."
 tnor_2rjw_dragon.3.a:0 "Ratify the agreement."
 tnor_2rjw_dragon.4.t:0 "The Terms of Surrender"
 tnor_2rjw_dragon.4.d:0 "Another government has surrendered under Operation Broken Dragon and accepted Russian oversight. Its administration will remain in place under the new settlement."
 tnor_2rjw_dragon.4.a:0 "Record the surrender."
 tnor_2rjw_dragon.5.t:0 "The Proposal Is Rejected"
 tnor_2rjw_dragon.5.d:0 "At least one of the governments rejected our terms. The General Staff may proceed with Operation Broken Dragon."
 tnor_2rjw_dragon.5.a:0 "Inform the General Staff."
 tnor_2rjw_dragon.6.t:0 "Operation Broken Dragon"
 tnor_2rjw_dragon.6.d:0 "Russia has opened hostilities. The first reports have reached the cabinet, along with a demand to surrender and accept a government under Russian oversight."
 tnor_2rjw_dragon.6.a:0 "Alert the cabinet."
