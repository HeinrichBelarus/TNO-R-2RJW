l_russian:
 TNOR_2RJW_secret_meeting:0 "Тайное совещание"
 TNOR_2RJW_secret_meeting_desc:0 "Генеральный штаб собирается за закрытыми дверями, чтобы выбрать направление будущей кампании."
 TNOR_2RJW_march_east:0 "Поход на Восток"
 TNOR_2RJW_march_east_desc:0 "Начать подготовку к восточной кампании. До начала боевых действий должно пройти не менее 730 дней."
 TNOR_2RJW_return_to_eastern_question:0 "Вернуться к восточному вопросу"
 TNOR_2RJW_return_to_eastern_question_desc:0 "Мир на западе, завершение реконструкции и выборов позволяют вновь поставить восточный вопрос."
 TNOR_2RJW_survey_the_trans_siberian:0 "Обследовать Транссибирскую магистраль"
 TNOR_2RJW_survey_the_trans_siberian_desc:0 "Поручить инженерам оценить пропускную способность магистрали и определить участки, требующие ремонта."
 tnor_2rjw_story.1.t:0 "За закрытыми дверями"
 tnor_2rjw_story.1.d:0 "Офицеры разложили на столе две карты. На первой были дороги на запад и земли под немецкой властью. По второй тянулась железная дорога к Тихому океану. Председатель спросил, какую карту оставить на столе."
 tnor_2rjw_story.1.a:0 "Генштаб получит свой ответ."
 tnor_2rjw_story.2.t:0 "Восточный вопрос"
 tnor_2rjw_story.2.d:0 "Генштаб начинает готовить западный поход. Кабинету ещё предстоит решить, что сказать Токио. Можно начать переговоры о Владивостоке сейчас или оставить этот вопрос правительству, которое уже добилось мира на западе."
 tnor_2rjw_story.2.a:0 "Начать переговоры с Японией."
 tnor_2rjw_story.2.b:0 "Вернуться к вопросу после победы над Германией."
