 tnor_2rjw_partisan_supply_category:0 "Вооружение партизан"
 tnor_2rjw_partisan_supply_category_desc:0 "§YМонголия§! — оснащено и готово выступить дивизий: [?tnor_2rjw_mongolia_divisions|0].\n§YДальний Восток§! — оснащено и готово выступить дивизий: [?tnor_2rjw_primorye_divisions|0]."
 tnor_2rjw_supply_mongolia:0 "Оснастить монгольскую партизанскую бригаду"
 tnor_2rjw_supply_primorye:0 "Оснастить дальневосточную партизанскую бригаду"
 tnor_2rjw_supply_mongolia_desc:0 "Выделить 615 единиц пехотного, 72 противотанкового и 30 дополнительного оснащения на одну бригаду в Монголии."
 tnor_2rjw_supply_primorye_desc:0 "Выделить 615 единиц пехотного, 72 противотанкового и 30 дополнительного оснащения на одну бригаду на Дальнем Востоке."
 tnor_2rjw_dragon.1.t:0 "Ультиматум под прикрытием"
 tnor_2rjw_dragon.1.d:0 "Западные провинции Китая лежат между нашей армией и японской сферой. Кабинету предстоит решить, предложить ли соглашение Синьцзяну и Цинхаю или поручить Генштабу навязать наши условия."
 tnor_2rjw_dragon.1.a:0 "Отправить делегации."
 tnor_2rjw_dragon.1.b:0 "Готовить операцию «Сломленный дракон»."
 tnor_2rjw_dragon.2.t:0 "Предложение России"
 tnor_2rjw_dragon.2.d:0 "Российские делегаты прибыли в [ROOT.GetNameDef] с проектом соглашения. Их правительство обещает защиту в грядущем конфликте. Взамен оно требует контроля над нашей внешней и военной политикой."
 tnor_2rjw_dragon.2.a:0 "Принять условия."
 tnor_2rjw_dragon.2.b:0 "Отклонить предложение."
 tnor_2rjw_dragon.3.t:0 "Общий враг, общее дело"
 tnor_2rjw_dragon.3.d:0 "Делегации приняли условия. После ратификации правительства, подписавшие соглашение, станут зависимыми от России."
 tnor_2rjw_dragon.3.a:0 "Ратифицировать соглашение."
 tnor_2rjw_dragon.4.t:0 "Условия капитуляции"
 tnor_2rjw_dragon.4.d:0 "Ещё одно правительство капитулировало в ходе операции «Сломленный дракон» и приняло российский надзор. Его администрация продолжит работу на новых условиях."
 tnor_2rjw_dragon.4.a:0 "Зафиксировать капитуляцию."
 tnor_2rjw_dragon.5.t:0 "Предложение отклонено"
 tnor_2rjw_dragon.5.d:0 "По меньшей мере одно правительство отклонило наши условия. Генштаб может приступать к операции «Сломленный дракон»."
 tnor_2rjw_dragon.5.a:0 "Доложить Генштабу."
 tnor_2rjw_dragon.6.t:0 "Операция «Сломленный дракон»"
 tnor_2rjw_dragon.6.d:0 "Россия начала боевые действия. В кабинет поступили первые донесения и требование капитулировать, приняв российский надзор над правительством."
 tnor_2rjw_dragon.6.a:0 "Оповестить кабинет."
